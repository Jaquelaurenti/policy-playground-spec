name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Policy Spec (validador)
        run: python -m unittest discover -s tests
      - name: Backend (domínio, API, adaptadores AWS com moto)
        working-directory: app/backend
        run: |
          pip install -r requirements-dev.txt
          python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: app/frontend/package-lock.json }
      - name: Front-end (type-check + build)
        working-directory: app/frontend
        run: npm ci && npm run build
      - name: Imagem do backend sobe e responde
        run: |
          docker build -f app/Dockerfile -t pp-demo .
          docker run -d -p 8080:8080 --name pp pp-demo
          for i in $(seq 1 20); do curl -fs localhost:8080/api/health && exit 0; sleep 1; done
          docker logs pp; exit 1
